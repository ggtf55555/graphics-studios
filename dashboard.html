<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>لوحة المهام</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#0e0f12" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Aref+Ruqaa:wght@400;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="assets/styles.css" />
</head>
<body>

<header class="dash-header">
  <div class="wrap">
    <a class="brand" href="index.html"><span class="dot"></span> استوديوهات الإنتاج</a>
    <div class="who">
      <span>مرحباً، <strong id="who-name">…</strong></span>
      <button class="btn" id="signout">تسجيل الخروج</button>
    </div>
  </div>
</header>

<main class="dash-body">
  <div class="wrap">
    <div class="panel">
      <h2 style="margin-bottom:10px">لوحة المهام قيد الإنشاء</h2>
      <p style="color:var(--text-muted);max-width:56ch">
        تسجيل الدخول يعمل. الخطوة التالية: عرض مهامك (إن كنت مصمماً) أو لوحة إدارة الفريق
        (إن كنت من الإدارة) — بديلاً كاملاً لشيت المتابعة الحالي، مع إدخال صوتي للمهام
        وزر نسخ المهمة المنجزة بصيغة جاهزة للصق في تطبيق المؤسسة.
      </p>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="assets/supabase-client.js"></script>
<script>
(async () => {
  const session = await requireSession("index.html");
  if (!session) return;

  const { data: profile } = await sb.from("profiles").select("full_name, role").eq("id", session.user.id).single();
  document.getElementById("who-name").textContent = profile ? profile.full_name : session.user.email;

  document.getElementById("signout").addEventListener("click", async () => {
    await sb.auth.signOut();
    window.location.href = "index.html";
  });
})();
</script>
</body>
</html>
